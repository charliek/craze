# The eval's target models and each harness's id for them (plan 029 §3.1.4).
#
# provider     craze provider name; it picks the proxy route (and the key).
# wire_model   the `model` every request must name (the proxy's allowlist).
# effort       the one pinned reasoning effort per model -- the default craze and gx
#              already share (reasoning-effort parity).
# craze / gx   the alias in each tool's model table, copied by `crazeeval snapshot-config`:
#              craze's from its shipped catalog with the owner's models.toml merged over
#              it; gx's from the owner's gx config, where it is optional (a model it does
#              not name cannot run the gx harness).
# opencode     <provider>/<model> in opencode's own ids (its built-in providers).
# codex        the wire model, only where the provider serves the Responses API
#              (Meta, Fireworks; Z.AI and Anthropic do not -- §2.6). Absent = codex does
#              not run.
# codex_provider  the provider id in the generated codex config.

[models."muse-spark-1.3"]
provider = "meta"
wire_model = "muse-spark-1.3"
effort = "high"
craze = "muse-spark-1.3"
gx = "muse-spark-1.3"
opencode = "meta/muse-spark-1.3"
codex = "muse-spark-1.3"
codex_provider = "meta"

[models."muse-spark-1.3-contributor"]
provider = "meta"
wire_model = "muse-spark-1.3-contributor"
effort = "high"
craze = "muse-spark-1.3-contributor"
gx = "muse-spark-1.3-contributor"
opencode = "meta/muse-spark-1.3-contributor"
codex = "muse-spark-1.3-contributor"
codex_provider = "meta"

