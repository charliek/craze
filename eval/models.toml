# Anthropic's Messages API (craze plan 044; plan 047 D11). effort is craze's default for
# every Claude model that offers it ([anthropic_defaults] default_effort, medium). gx
# speaks the Messages API (api_backend "messages", homes.gx_home), so it runs; codex
# does not (no Responses API). The craze home reaches the proxy through
# CRAZE_TEST_ANTHROPIC_API (homes.anthropic_api); see RUNBOOK §3.
[models."anthropic/claude-opus-5-5"]
provider = "anthropic"
wire_model = "claude-opus-5-5"
effort = "medium"
craze = "anthropic/claude-opus-5-5"
gx = "anthropic/claude-opus-5-5"
opencode = "anthropic/claude-opus-5-5"

