[models."fireworks/kimi-k3"]
provider = "fireworks"
wire_model = "accounts/fireworks/models/kimi-k3"
effort = "high"
craze = "fireworks/kimi-k3"
gx = "fireworks/kimi-k3"
opencode = "fireworks-ai/accounts/fireworks/models/kimi-k3"
codex = "accounts/fireworks/models/kimi-k3"
codex_provider = "fireworks"
# Dominates cost (plan 029 §9): one rep, last in each batch.
last = true

# Kimi K3.1 Pro, Moonshot's successor to K3. It was Fireworks' start model in craze's
# catalog until the campaign for GitHub issue #118 (eval/results/2026-11-start-models),
# which moved the start to DeepSeek V4.1 Flash 1017. K3 above, deprecated in craze's
# catalog but still run by name, is its comparison baseline. Its opencode id is in the models.dev
# catalog (checked 2026-11-14).
[models."fireworks/kimi-k3p1-pro"]
provider = "fireworks"
wire_model = "accounts/fireworks/models/kimi-k3p1-pro"
effort = "high"
craze = "fireworks/kimi-k3p1-pro"
gx = "fireworks/kimi-k3p1-pro"
opencode = "fireworks-ai/accounts/fireworks/models/kimi-k3p1-pro"
codex = "accounts/fireworks/models/kimi-k3p1-pro"
codex_provider = "fireworks"
# Batched as K3 is, last in each batch, so the two are compared like for like (same
# position, after the cheap models' runs).
last = true

