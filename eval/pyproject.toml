[project]
name = "crazeeval"
version = "0.0.0"
description = "craze native harness evaluation: recording proxy, sandboxed runners, tasks and checks (plan 029)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "tomli-w>=1.0",
    "pytest>=8",
]

[project.scripts]
crazeeval = "crazeeval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crazeeval"]

[tool.pytest.ini_options]
# The fixtures and the tasks' hidden tests are deliberately buggy or deliberately
# failing on an untouched workspace; they must never be collected here.
testpaths = ["tests"]
norecursedirs = ["fixtures", "tasks"]
addopts = "-q"
