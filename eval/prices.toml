# Prices in US$ per 1M tokens, keyed by wire model id (the `model` a request names).
# Plan 029 §2.7, researched 2026-09-27.
#
# input / cached_input / output are the LEDGER prices: conservative, and what counts
# against the budget cap. list_* are the published prices, reported beside them.
# cache_write (optional, default 0) is a cache write's price: the Messages API's
# cache_creation_input_tokens (Anthropic's 5-minute write), the only provider that
# reports one. long_context_above with a [models."<id>".long_context] table (input,
# cached_input, cache_write and output, all required; list_* default to them) is a
# long-context tier: a request whose prompt -- uncached input, cache reads and cache
# writes together -- is over the threshold pays the tier's rates for every token of it;
# exactly the threshold is base (craze plan 047 D10).
# zero_rated models (the Z.AI coding plan, a flat subscription) cost $0 against the
# cap; their list_* are a list-equivalent (Fireworks GLM 5.3) that is reported only.
# prior_run_cost is the pinned per-run estimate `crazeeval run` uses for a model with
# no completed runs in the ledger yet (plan 029 §3.1.7).
#
# A wire model missing here is refused by the proxy.

