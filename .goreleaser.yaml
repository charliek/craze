version: 2

project_name: craze

# No `before.hooks: go mod tidy` (prox has one): CI's lint job already fails
# the build on go.mod/go.sum drift, so re-running tidy here would only mask
# the same problem later than it should be caught.
#
# The one hook writes the release's models.json (plan 050 C2): `craze models
# --shipped --json`, the catalog compiled into this release, which an
# orchestrator pins by version and sha256. The builds below cross-compile, so
# the hook makes its own build for the machine it runs on, with the release's
# version ldflag (crazeVersion is the packaged version), and runs it under
# `env -i`: no HOME, no key, no CRAZE_HOME can reach it. It lands in bin/
# (ignored by git, and untouched by --clean, which empties dist/ after the
# hooks have run), and the checksum and release sections below pick it up.
before:
  hooks:
    - sh -c 'mkdir -p bin/release && CGO_ENABLED=0 go build -ldflags "-X github.com/charliek/craze/internal/version.Version={{ .Version }}" -o bin/release/craze-models ./cmd/craze && env -i bin/release/craze-models models --shipped --json > bin/release/models.json'

builds:
  - id: craze
    binary: craze
    main: ./cmd/craze
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/charliek/craze/internal/version.Version={{.Version}}

# cmd/craze-fake-agent is a test double for the ACP client, not a shipped
# binary, so it has no build entry here.

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

nfpms:
  - id: craze-deb
    package_name: craze
    file_name_template: "craze_{{ .Version }}_{{ .Arch }}"
    vendor: charliek
    homepage: "https://github.com/charliek/craze"
    maintainer: "Charlie Knudsen <charlie.knudsen@gmail.com>"
    description: "Terminal UI for coding agents: cursor-agent, grok, gx, or a built-in agent"
    license: MIT
    formats:
      - deb
    bindir: /usr/local/bin
    ids:
      - craze

# `brews` is deprecated in favour of `homebrew_casks`, and GoReleaser will
# warn about that on every run. That warning is expected: casks are
# macOS-only, and this tap's formulae need to install on Linux too, so we
# stay on `brews` on purpose.
brews:
  - name: craze
    ids:
      - default
    # A prerelease tag (rc, beta, ...) must never overwrite the stable
    # formula in the tap; prox doesn't need this because it has no
    # prereleases yet.
    skip_upload: auto
    repository:
      owner: charliek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/charliek/craze"
    description: "Terminal UI for coding agents: cursor-agent, grok, gx, or a built-in agent"
    license: "MIT"
    install: |
      bin.install "craze"
    test: |
      system bin/"craze", "version"
    caveats: |
      craze's built-in agent needs no other CLI: `craze auth login` stores a
      model provider's API key, and `craze auth login chatgpt` signs in to a
      ChatGPT plan. cursor-agent, grok and gx are optional: install one and
      log in to drive it over ACP instead.
      Docs: https://charliek.github.io/craze/

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: ./bin/release/models.json

release:
  github:
    owner: charliek
    name: craze
  draft: false
  prerelease: auto
  mode: replace
  extra_files:
    - glob: ./bin/release/models.json

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
