# Synthetic gx providers.toml for craze's importer tests, layered over
# config.toml. Not a copy of a real gx file; it holds no key.

# gx takes only model, model_providers and auth_provider from this file, so
# this default is ignored in favour of config.toml's.
[models]
default = "glm-5.3"

# A provider only this file has. Its context_window is inherited by models
# that set none.
[model_providers.meta]
base_url = "https://api.meta.example/v1"
api_backend = "chat_completions"
env_key = "META_API_KEY"
context_window = 1000000

# Overrides one field of config.toml's provider; the rest is config.toml's.
[model_providers.fireworks]
env_key = ["FIREWORKS_API_KEY", "FW_API_KEY"]

# Overrides a config.toml model: a scalar wins, an array is replaced whole.
[model."fireworks/kimi-k3"]
max_completion_tokens = 65536
reasoning_efforts = ["low", "high"]

# reasoning_effort names an effort the list does not offer: no default.
[model."muse-spark-1.3"]
model = "muse-spark-1.3"
name = "Muse Spark 1.3"
model_provider = "meta"
max_completion_tokens = 131072
supports_reasoning_effort = true
reasoning_effort = "medium"
reasoning_efforts = ["low", "high"]

[model."openrouter/minimax-m3"]
model = "minimax/minimax-m3"
name = "MiniMax M3"
model_provider = "openrouter"
context_window = 204800
