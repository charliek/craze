# craze's shipped model catalog (plan 031 §3.1).
#
# This file is compiled into the craze binary (go:embed, catalog.go): every
# craze release carries the catalog it was built with, and an upgrade is how a
# machine gets a new one. The user's own ~/.craze/native/providers.toml and
# models.toml are merged over it at load (plan 031 §3.2): they hold keys,
# per-model overrides and models the user adds, never a copy of this file.
#
# It never holds a key. Its schema is its own, and it is decoded strictly: an
# api_key, source, catalog, [subagents] or [compaction] here is a load error.
# TestShippedCatalog (catalog_test.go, run by `make test` and CI) checks every
# rule the merge relies on.
#
# A change here is a release (RELEASING.md): to rename a model, add the new
# alias and retire the old one (a [[retired]] row with no wire_models when the
# new alias keeps the wire id, which stays live); to retire a model, remove it
# and add a [[retired]] row naming its alias, its provider and every wire model
# id it has pointed at.

version = 1
default_model = "fireworks/deepseek-v4p1-flash"

# ---------------------------------------------------------------------------
# Retired aliases. A user's entry an old import left for one (source = "gx") is
# ignored, a [subagents] or default_model naming one falls back silently, and
# any user model entry whose (provider, wire model) is one of these identities
# is dropped silently: a dead wire id is dead whoever wrote it (plan 031 §3.3).
# Wire ids from the owner's models.toml backups (2026-09-18 to 2026-09-29), gx's
# Fireworks presets (grok-build providers_cmd.rs) and D-24 (deepseek-v4-pro-0813).

[[retired]]
alias = "fireworks/deepseek-v4-flash"
provider = "fireworks"
wire_models = ["accounts/fireworks/models/deepseek-v4-flash-0731"]

[[retired]]
alias = "fireworks/deepseek-v4-pro"
provider = "fireworks"
wire_models = ["accounts/fireworks/models/deepseek-v4-pro", "accounts/fireworks/models/deepseek-v4-pro-0813"]

[[retired]]
alias = "fireworks/kimi-k2p7-code"
provider = "fireworks"
wire_models = ["accounts/fireworks/models/kimi-k2p7-code"]

# The two Fireworks routers and the three GPT-5.6 ids still answered on
# 2026-09-29: the owner dropped the aliases, not dead endpoints, so these rows
# retire the alias only (plan 031 X6) and a hand entry pointing at the live id
# stays the user's own model (§3.3).
[[retired]]
alias = "fireworks/glm-5p3-fast"
provider = "fireworks"

[[retired]]
alias = "fireworks/kimi-k3-fast"
provider = "fireworks"

[[retired]]
alias = "openrouter/gpt-5.6-luna"
provider = "openrouter"

[[retired]]
alias = "openrouter/gpt-5.6-sol"
provider = "openrouter"

[[retired]]
alias = "openrouter/gpt-5.6-terra"
provider = "openrouter"

# Replaced 2026-09-30 by OpenRouter's GPT-6.1 Sol (openai/gpt-6.1-sol).
# openai/gpt-6-sol still answers, so, like the GPT-5.6 rows above, the alias
# alone is retired (X6).
[[retired]]
alias = "openrouter/gpt-6-sol"
provider = "openrouter"

# ---------------------------------------------------------------------------
# Providers: a display name, the endpoint, and the environment variables a key
# may come from, tried in order before the user's inline api_key.

[providers.fireworks]
name = "Fireworks"
driver = "openai-compat"
base_url = "https://api.fireworks.ai/inference/v1"
env_keys = ["FIREWORKS_API_KEY"]

[providers.meta]
name = "Meta"
driver = "openai-compat"
base_url = "https://api.meta.ai/v1"
env_keys = ["META_API_KEY"]

[providers.openrouter]
name = "OpenRouter"
driver = "openrouter"
env_keys = ["OPENROUTER_API_KEY"]

[providers.zai-coding-plan]
name = "Z.AI Coding Plan"
driver = "openai-compat"
base_url = "https://api.z.ai/api/coding/paas/v4"
env_keys = ["ZHIPU_API_KEY", "ZAI_API_KEY"]

# ---------------------------------------------------------------------------
# Models, by alias. Every key but provider and wire_model is optional, as in
# models.toml; cost is dollars per 1,000,000 tokens.

[models."fireworks/deepseek-v4p1-flash"]
provider = "fireworks"
wire_model = "accounts/fireworks/models/deepseek-v4p1-flash"
name = "DeepSeek V4.1 Flash (Fireworks)"
context_window = 1048576
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
vision = true

[models."fireworks/deepseek-v4p1-flash".cost]
input = 0.3
output = 1.2
cache_read = 0.006

