wire_model = "claude-fable-5"
name = "Claude Fable 5"
family = "fable"
released = "2026-06-07"
thinking = "adaptive"
context_window = 1000000
max_output_tokens = 64000
efforts = ["low", "medium", "high", "xhigh", "max"]
vision = true

