# craze's shipped model catalog (plan 031 §3.1).
#
# This file is compiled into the craze binary (go:embed, catalog.go): every
# craze release carries the catalog it was built with, and an upgrade is how a
# machine gets a new one. The user's own ~/.craze/native/providers.toml and
# models.toml are merged over it at load (plan 031 §3.2): they hold keys,
# per-model overrides and models the user adds, never a copy of this file.
#
# It never holds a key. Its schema is its own, and it is decoded strictly: an
# api_key, source, catalog, default_model, [subagents] or [compaction] here is
# a load error (default_model is the user's own pin, in models.toml: plan 038).
# TestShippedCatalog (catalog_test.go, run by `make test` and CI) checks every
# rule the merge relies on.
#
# A change here is a release (RELEASING.md): to rename a model, add the new
# alias and retire the old one (a [[retired]] row with no wire_models when the
# new alias keeps the wire id, which stays live); to retire a model, remove it
# and add a [[retired]] row naming its alias, its provider and every wire model
# id it has pointed at.

version = 1

# Where a new session with nothing remembered and no default_model pin of the
# user's starts (plan 038 §2): the first provider here with a key, on the
# first model of its start that resolves; "eval winner first". It names every
# provider below exactly once. A user's models.toml provider_order replaces it
# whole.
provider_order = ["zai-coding-plan", "chatgpt", "fireworks", "openrouter", "meta"]

# ---------------------------------------------------------------------------
# Retired aliases. A user's entry an old import left for one (source = "gx") is
# ignored, a [subagents] model or default_model naming one is dropped
# silently, and any user model entry whose (provider, wire model) is one of
# these identities is dropped silently: a dead wire id is dead whoever wrote it
# (plan 031 §3.3).
# Wire ids from the owner's models.toml backups (2026-09-18 to 2026-09-29), gx's
# Fireworks presets (grok-build providers_cmd.rs) and D-24 (deepseek-v4-pro-0813).

[[retired]]
alias = "fireworks/deepseek-v4-flash"
provider = "fireworks"
wire_models = ["accounts/fireworks/models/deepseek-v4-flash-0731"]

[[retired]]
alias = "fireworks/deepseek-v4-pro"
provider = "fireworks"
wire_models = ["accounts/fireworks/models/deepseek-v4-pro", "accounts/fireworks/models/deepseek-v4-pro-0813"]

[[retired]]
alias = "fireworks/kimi-k2p7-code"
provider = "fireworks"
wire_models = ["accounts/fireworks/models/kimi-k2p7-code"]

# The two Fireworks routers and the three GPT-5.6 ids still answered on
# 2026-09-29: the owner dropped the aliases, not dead endpoints, so these rows
# retire the alias only (plan 031 X6) and a hand entry pointing at the live id
# stays the user's own model (§3.3).
[[retired]]
alias = "fireworks/glm-5p3-fast"
provider = "fireworks"

[[retired]]
alias = "fireworks/kimi-k3-fast"
provider = "fireworks"

[[retired]]
alias = "openrouter/gpt-5.6-luna"
provider = "openrouter"

[[retired]]
alias = "openrouter/gpt-5.6-sol"
provider = "openrouter"

[[retired]]
alias = "openrouter/gpt-5.6-terra"
provider = "openrouter"

# Replaced 2026-09-30 by OpenRouter's GPT-6.1 Sol (openai/gpt-6.1-sol).
# openai/gpt-6-sol still answers, so, like the GPT-5.6 rows above, the alias
# alone is retired (X6).
[[retired]]
alias = "openrouter/gpt-6-sol"
provider = "openrouter"

# ---------------------------------------------------------------------------
# Providers: a display name, the endpoint, and the environment variables a key
# may come from, tried in order before the user's inline api_key. start is the
# provider's own models a new session starts on when provider_order reaches
# it, in order of preference: the first that resolves wins (plan 038 §2.2).

[providers.fireworks]
name = "Fireworks"
driver = "openai-compat"
base_url = "https://api.fireworks.ai/inference/v1"
env_keys = ["FIREWORKS_API_KEY"]
start = ["fireworks/ember-1"]

[providers.meta]
name = "Meta"
driver = "openai-compat"
base_url = "https://api.meta.ai/v1"
env_keys = ["META_API_KEY"]
start = ["muse-spark-1.3-contributor"]

# OpenRouter's start is Gemini: its other models overlap with ones a cheaper
# provider ships.
[providers.openrouter]
name = "OpenRouter"
driver = "openrouter"
env_keys = ["OPENROUTER_API_KEY"]
start = ["openrouter/gemini-3.8-flash"]

[providers.zai-coding-plan]
name = "Z.AI Coding Plan"
driver = "openai-compat"
base_url = "https://api.z.ai/api/coding/paas/v4"
env_keys = ["ZHIPU_API_KEY", "ZAI_API_KEY"]
start = ["glm-5.3"]

# The ChatGPT plan (plan 033 §3.11): OpenAI's Responses API at its fixed
# endpoint, funded by Sign in with ChatGPT (craze auth login chatgpt, or
# /connect), never by a key, so it names no variable and takes no api_key. Its
# models are not shipped here: they are the signed-in account's own list,
# fetched and cached beside the model files, and each is chatgpt/<slug>. Its
# start is [chatgpt_defaults] start, below, never a start key here.
[providers.chatgpt]
name = "ChatGPT plan"
driver = "chatgpt"

# craze's own settings for the ChatGPT plan's models (plan 033 §3.11), laid
# over the account's list: never models of the catalog's, so they need no
# history line and show nothing for an account that does not list them. start
# is the plan's start (plan 038 §2.2): the slugs a new session with nothing
# remembered starts on when provider_order reaches chatgpt; a slug's table
# takes name, efforts, default_effort and tool_profile.
#
# models_client_version (plan 034 §3.1, D-82) is the client_version every
# request for the account's model list carries: the server gates the list on
# it (none sent: 5 models; 0.0.1: none; 0.160.0: all 8, 2026-10-03), so craze
# claims one version it has tested, not codex's and not a very high one. It is
# required while the chatgpt provider ships here, and it is not a user key
# (configuration.md does not list it). Bump it only when a model the plan lists
# has a minimal_client_version above it AND that model has been verified live
# (a tool loop, an image, a sub-agent: eval/ and the plan 034 V1 recipe). A
# bump is a change to this file plus a release: update the value, run the
# modeltable and chatgptauth tests (the fake server gates on the version),
# note it in discovery/native-harness/08-decisions.md, and release. A cache
# fetched with another version is refetched at the next sign-in, open or
# refresh, and a reader drops a model above its own pin, so an older binary
# never offers a newer pin's models.
#
# start is in order of preference: the first slug the account lists and the
# sign-in funds wins; with none, provider_order goes on to the next provider.
[chatgpt_defaults]
models_client_version = "0.160.0"
start = ["gpt-6.1-sol", "gpt-5.6-sol"]

[chatgpt_defaults.models."gpt-6-astra"]
default_effort = "low"

# ---------------------------------------------------------------------------
# Models, by alias. Every key but provider and wire_model is optional, as in
# models.toml; cost is dollars per 1,000,000 tokens. The Z.AI Coding Plan's
# models are unpriced: a flat-rate plan, like ChatGPT's (plan 038 §2.6).

[models."fireworks/deepseek-v4p1-flash"]
provider = "fireworks"
wire_model = "accounts/fireworks/models/deepseek-v4p1-flash"
name = "DeepSeek V4.1 Flash (Fireworks)"
context_window = 1048576
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
vision = true

[models."fireworks/deepseek-v4p1-flash".cost]
input = 0.3
output = 1.2
cache_read = 0.006

