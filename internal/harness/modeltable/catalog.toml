# Meta's Muse models through OpenRouter, for a machine with no Meta key (plan
# 050). They are Meta's (maker = "meta"): with a Meta key the source order
# offers Meta's own and hides these, which still run by name. OpenRouter has
# no ~meta router, so each is on its own id. Window, efforts, vision and price
# are the model list's on 2026-11-11, the same prices Meta charges; the
# ceiling and default effort are the direct entries'. This is Chat
# Completions, not Meta's Responses API: a tool loop cached one step in three
# here. Seen live through craze on 2026-11-11: a tool loop.
