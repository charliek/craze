# The openrouter/*-latest models are OpenRouter's ~<family>-latest routers:
# each answers as the newest model of its family, so a release there moves it
# with no change here. Their window, efforts, vision and price are the
# family's newest on 2026-10-09 (DeepSeek V4.1 Flash, Gemini 3.8 Flash, GLM
# 5.3 Flash, GLM 5.3, GPT-6 Astra, GPT-6 Luna, GPT-6.1 Sol), and want a look
# when the family moves on. Efforts are the router's supported_efforts in
# OpenRouter's model list; a price is its listed one, its cheapest
