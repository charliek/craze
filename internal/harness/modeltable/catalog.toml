# The openrouter/*-latest models are OpenRouter's ~<family>-latest routers:
# each answers as the newest model of its family, so a release there moves it
# with no change here. Their window, efforts and vision are the family's
# newest on 2026-10-09 (DeepSeek V4.1 Flash, Gemini 3.8 Flash, GLM 5.3 Flash,
# GLM 5.3, GPT-6 Astra, GPT-6 Luna, GPT-6.1 Sol), and GPT-6.1 Terra on
# 2026-11-11, and want a look when the family moves on. Efforts are the
# router's supported_efforts in OpenRouter's model list. Each was seen live
# through craze on 2026-10-09 (Terra on 2026-11-11): a tool loop on its ~ wire
# id, and every vision model described an image read from disk.
#
# A router's price is its MAKER's own endpoint's, not the model list's. The
# list gives the cheapest endpoint's rate (DeepSeek Flash $0.022 / $0.40 at
# Morph, GLM Flash $0.0399 / $0.0784 at Relace, GLM $0.0699 / $1.40 at Wafer on
# 2026-11-11), but a request goes to whichever endpoint serves it, and the
# requests of 2026-11-11 were billed 3 to 9 times the listing (Relace, Cohere,
# Reka and Decart endpoints among them). So the open-weight routers are priced
# at the maker's own endpoint on OpenRouter, the rate a request can be
# counted on to cost at most: DeepSeek $0.30 input / $1.20 output / $0.006
# cache read (its endpoint's weekday rate; OpenRouter halves it overnight UTC
# and at the weekend, not counted here), Z.AI $0.15 / $0.50 / $0.03 for GLM
# Flash and $1.40 / $4.40 / $0.26 for GLM (Z.AI's endpoint, the same as
# Fireworks' GLM rows). The GPT routers' prices are OpenAI's, the same as the
# list's.
#
# The four GPT routers (Sol, Astra, Terra, Luna) carry OpenAI's tier: a prompt
# over 272,000 tokens is billed at the long rates for the whole request, so a
# session compacts at 85% of 272,000 (default_context, a trigger, not a cap)
# with the true window kept; a request that runs over is priced at the tier.
# They set no cache_write: OpenRouter lists cache-write rates for them (Sol
# 2.50, Astra 12.50, Terra 1.25, Luna 0.125), but the openrouter driver
# reports no cache-write tokens, so a rate would never be applied; a left-out
