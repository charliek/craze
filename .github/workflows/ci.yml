name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
    branches: [main, 'feature/*']

# test and cli run both a Linux and a macOS leg: craze ships for both via the
# tap's Homebrew formula (linux and darwin archives, see .goreleaser.yaml)
# and the apt package (linux-only debs, amd64 and arm64), so both are
# platforms real users run on. Agent spawn itself is plain pipes plus
# Setpgid (internal/acp/spawn.go) — no pty — so there was never a technical
# reason this couldn't build and pass on darwin; ptys only show up in this
# repo's own tests. lint and build stay ubuntu-only, but not because
# compiling is platform-independent — it isn't, and this repo does reach for
# syscall.SysProcAttr and syscall.Flock. They stay ubuntu-only because the
# macOS legs below already compile everything: `go test ./...` builds every
# package there, and the cli job runs `make build` on both legs. A separate
# darwin build job would recompile what those legs just compiled. The same
# goes for lint: there is no GOOS-suffixed or //go:build-gated source in the
# tree, so there is no file golangci-lint would only see with GOOS=darwin.
# Add either of those and this reasoning needs revisiting.
jobs:
  test:
    strategy:
      # fail-fast: false so a failure on one OS doesn't cancel the other leg
      # mid-run — losing that leg's result would hide whether the bug is
      # platform-specific or universal, which is the one thing worth knowing
      # first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Hard backstop. Without this a job inherits GitHub's 6-hour default, so a
    # deadlocked test — or a hung fake agent holding the job's stdout pipe open,
    # which Go's own -timeout cannot interrupt — burns runner minutes until
    # someone notices. The suite takes ~30s locally; hosted runners are slower
    # and have fewer cores, and macos-latest (arm64) is the slower of the two,
    # so 15 minutes started clipping it — 20 keeps the same generous-but-bounded
    # intent for the new ceiling.
    timeout-minutes: 20
    steps:
      # persist-credentials: false — actions/checkout otherwise leaves the job
      # token in .git/config, and the very next step runs `go test ./...`, i.e.
      # this repo's code AND every dependency's test code, with a writable
      # credential sitting on disk. Nothing here talks to the API.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # -timeout must match the Makefile's, or a local pass and a CI pass do not
      # mean the same thing: with no flag `go test` uses its own 10m default, so
      # a run that passes under `make test` could die on a CI panic dump.
      - run: go test -timeout 5m -v ./...
      # The three packages with concurrency worth the 10x slowdown: the ACP
      # client's reader and writer goroutines, the session's event fan-out, and
      # the TUI's clipboard seams and leaked command goroutines. Unconditional —
      # a race check that silently skips itself is worse than none.
      - run: go test -timeout 5m -race ./internal/acp ./internal/agent ./internal/tui

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # See the test job: the linter loads and analyses the same third-party
      # code, so the token has no business being on disk here either.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pinned to the same version .mise.toml installs locally, so `make lint`
      # and this job cannot disagree about what a lint failure is.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
      # go.mod / go.sum drift is not a lint rule, and it breaks
      # `go install ...@main` for everyone else rather than anything in here.
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # `go test ./...` compiles the packages but not the two binaries, and the
      # ldflags version stamp is only exercised here.
      - run: make build
      - run: ./bin/craze --version

  cli:
    strategy:
      # Same reasoning as the test job's matrix: don't let one OS's failure
      # cancel the other leg before it reports.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      # The pytest suites drive the real binaries — `craze frame`'s token
      # scripts and `craze prompt` against the fake agent — so the build is a
      # prerequisite, not a duplicate of the build job. The tmux smoke suite is
      # deliberately not collected here: it needs a terminal emulator and
      # CRAZE_TMUX=1, and is run by hand.
      - run: make build
      - run: make test-cli

  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # See the test job for why persist-credentials is false. fetch-depth: 0
      # is new here: GoReleaser walks tag history to compute a version, and
      # the default shallow clone would leave it with none.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pinned to the same version .mise.toml installs locally (and that
      # release.yml uses for the real release), so a snapshot build here
      # can't disagree with what a contributor sees on their own machine.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.3
          args: release --snapshot --clean
      # --snapshot never publishes, so everything below only proves the
      # config still produces the artifacts a real release depends on:
      # both binaries, both platforms, both archive and deb packaging.
      - name: artifact counts
        run: |
          set -euo pipefail
          archives=$(jq '[.[] | select(.type == "Archive")] | length' dist/artifacts.json)
          packages=$(jq '[.[] | select(.type == "Linux Package")] | length' dist/artifacts.json)
          checksums=$(jq '[.[] | select(.type == "Checksum")] | length' dist/artifacts.json)
          echo "archives=$archives packages=$packages checksums=$checksums"
          test "$archives" = "4"
          test "$packages" = "2"
          test "$checksums" = "1"
      - name: deb contents and metadata
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            deb=$(jq -r --arg arch "$arch" \
              '.[] | select(.type == "Linux Package" and .goarch == $arch) | .path' \
              dist/artifacts.json)
            dpkg-deb --info "$deb" | grep -q 'Package: craze'
            dpkg-deb --info "$deb" | grep -q "Architecture: $arch"
            dpkg-deb --contents "$deb" | grep -q './usr/local/bin/craze$'
          done
      - name: archive contents
        run: |
          set -euo pipefail
          mapfile -t archives < <(
            jq -r '.[] | select(.type == "Archive") | .path' dist/artifacts.json
          )
          # A `while read` over an empty query would loop zero times and exit
          # 0, so the step has to say out loud how many archives it expected
          # to open rather than trusting the count step above to have run.
          test "${#archives[@]}" = "4"
          for archive in "${archives[@]}"; do
            count=$(tar -tzf "$archive" | wc -l)
            test "$count" = "1"
            tar -tzf "$archive" | grep -qx 'craze'
          done
      - name: extracted binary reports a snapshot version
        run: |
          set -euo pipefail
          archive=$(jq -r \
            '.[] | select(.type == "Archive" and .goos == "linux" and .goarch == "amd64") | .path' \
            dist/artifacts.json)
          tmp=$(mktemp -d)
          tar -xzf "$archive" -C "$tmp"
          out=$("$tmp/craze" version)
          echo "version=$out"
          [[ "$out" == *SNAPSHOT* ]]
          [[ "$out" != "dev" ]]

  # The job id below must stay exactly `ci-success`, with no `name:`
  # override: that id is the check-run name the repo's main-protection
  # ruleset requires, the name the release workflow's ci-gate job polls for,
  # and the name the release skill matches on. A `name:` here changes what
  # shows up as the check without changing the job id other workflows key
  # off of, which would silently break all three.
  ci-success:
    needs: [test, lint, build, cli, release-snapshot]
    # GitHub's default `if` is `success()`, which SKIPS a job the moment any
    # dependency fails. A skipped required check is "no result" to branch
    # protection, not "failing" — so a red CI would merge clean instead of
    # being blocked. always() makes this job run — and fail loudly — exactly
    # when it should.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reading `needs` back as JSON, instead of hand-writing
      # `needs.test.result == 'success' && needs.lint.result == ... `, means
      # a job later added to the `needs:` list above is automatically
      # covered here — there is no second list to remember to keep in sync,
      # so forgetting one can't quietly leave the gate passing. Matrix jobs
      # (test, cli) already collapse to a single result each in this
      # context — GitHub reports the job as failed here if any one leg
      # failed — so one red macOS run fails the whole gate too.
      #
      # One hole, and it is GitHub's rather than ours: if two matrix legs
      # fail and you rerun only ONE of them, and it passes, the aggregator's
      # rerun can see the matrix job as successful while the other leg is
      # still red from the first attempt
      # (github.com/orgs/community/discussions/26822). Rerun all jobs, not a
      # single leg, when a matrix job is red.
      - name: require every dependency to have succeeded
        # Through env rather than interpolated straight into the run: line —
        # the expansion happens before the shell parses anything, so a job
        # that later grows an output containing a quote would otherwise
        # rewrite this command rather than be checked by it.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.result == "success")'
