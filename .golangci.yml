version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - staticcheck
    - unused
    - govet
    - ineffassign
    - misspell
  settings:
    depguard:
      rules:
        # One half of craze's import boundary; the other half is the `go list`
        # check in the Makefile's lint target (internal/tui and internal/cli
        # must not import internal/acp). The native harness imports nothing
        # from the rest of craze except internal/atomicfile, so it runs without
        # the ACP stack and could leave the repo whole (D-02; plan 018 §3.1).
        # All of craze's internal packages are denied to the harness's files,
        # and the two allow entries win as longer matches: the harness's own
        # packages and internal/atomicfile. A package added under internal/
        # later is therefore denied by default. The stdlib and third-party
        # modules stay allowed, and no file outside internal/harness is
        # affected.
        harness:
          list-mode: lax
          files:
            - "**/internal/harness/**"
          allow:
            - github.com/charliek/craze/internal/harness
            - github.com/charliek/craze/internal/atomicfile
          deny:
            - pkg: github.com/charliek/craze/internal
              desc: "the harness imports nothing from craze except internal/atomicfile; internal/agent's adapter imports the harness, never the reverse, and the harness receives its directory as Options.Home (D-02, plan 018 §3.1)"
        # The tool framework's tighter boundary inside the harness (plan 019
        # §3.1). depguard applies every rule whose files match, so these
        # files answer to `harness` above as well, and an import either rule
        # denies is reported: here, of the harness's own packages only the
        # framework and the redactor are allowed, and Fantasy is denied.
        # depguard sees direct imports only; internal/harness/tool's
        # deps_test.go checks the whole dependency closure.
        harness-tool:
          list-mode: lax
          files:
            - "**/internal/harness/tool/**"
            - "**/internal/harness/redact/**"
          allow:
            - github.com/charliek/craze/internal/harness/tool
            - github.com/charliek/craze/internal/harness/redact
            - github.com/charliek/craze/internal/atomicfile
          deny:
            - pkg: github.com/charliek/craze/internal
              desc: "the tool framework imports nothing from craze except internal/atomicfile and internal/harness/redact; toolbridge.go in the harness adapts it to Fantasy (plan 019 §3.1)"
            - pkg: charm.land/fantasy
              desc: "tools are craze's own contract: only internal/harness/toolbridge.go knows both a Tool and Fantasy (plan 019 §3.1, Seam 1)"
        # The redactor is a leaf under everything: the standard library only.
        harness-redact:
          list-mode: strict
          files:
            - "**/internal/harness/redact/**"
          allow:
            - $gostd
        # The engine's own import boundary (plan 021 §3.1): it sits above the
        # provider seam (agent.Session) and knows nothing of any one client or
        # provider transport, so a non-test file here may import neither
        # client package nor the ACP or harness transports. Split in two
        # because the package's own tests need a narrower rule: engine_test
        # drives the engine over tui.Stub, which is an ordinary Go dependency
        # an external test package is allowed to take on the package under
        # test, so $test files answer to a rule that allows internal/tui but
        # still denies internal/cli, internal/acp and internal/harness.
        engine:
          list-mode: lax
          files:
            - "**/internal/engine/**"
            - "!$test"
          deny:
            - pkg: github.com/charliek/craze/internal/tui
              desc: "the engine drives every client uniformly; a client package is exactly what it must not know about (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the engine drives every client uniformly; a client package is exactly what it must not know about (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the engine speaks to agent.Session alone; the wire protocol below that seam is not its concern (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the engine speaks to agent.Session alone; a provider transport below that seam is not its concern (plan 021 §3.1)"
        engine-test:
          list-mode: lax
          files:
            # depguard ORs several positive patterns rather than ANDing them,
            # so "**/internal/engine/**" plus the bare $test token (which
            # alone means "every test file in the module") would match every
            # test file project-wide, not just this package's. One glob that
            # is already both — under internal/engine and named _test.go — is
            # the combination that stays inside the package.
            - "**/internal/engine/**_test.go"
          deny:
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the engine's own tests drive it over tui.Stub, never a CLI client (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the engine speaks to agent.Session alone; the wire protocol below that seam is not its concern, in a test either (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the engine speaks to agent.Session alone; a provider transport below that seam is not its concern, in a test either (plan 021 §3.1)"
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
