version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - staticcheck
    - unused
    - govet
    - ineffassign
    - misspell
  settings:
    depguard:
      rules:
        # One half of craze's import boundary; the other half is the `go list`
        # check in the Makefile's lint target (internal/tui and internal/cli
        # must not import internal/acp). The native harness imports nothing
        # from the rest of craze except internal/atomicfile, so it runs without
        # the ACP stack and could leave the repo whole (D-02; plan 018 §3.1).
        # All of craze's internal packages are denied to the harness's files,
        # and the two allow entries win as longer matches: the harness's own
        # packages and internal/atomicfile. A package added under internal/
        # later is therefore denied by default. The stdlib and third-party
        # modules stay allowed, and no file outside internal/harness is
        # affected.
        harness:
          list-mode: lax
          files:
            - "**/internal/harness/**"
          allow:
            - github.com/charliek/craze/internal/harness
            - github.com/charliek/craze/internal/atomicfile
          deny:
            - pkg: github.com/charliek/craze/internal
              desc: "the harness imports nothing from craze except internal/atomicfile; internal/agent's adapter imports the harness, never the reverse, and the harness receives its directory as Options.Home (D-02, plan 018 §3.1)"
        # The tool framework's tighter boundary inside the harness (plan 019
        # §3.1). depguard applies every rule whose files match, so these
        # files answer to `harness` above as well, and an import either rule
        # denies is reported: here, of the harness's own packages only the
        # framework and the redactor are allowed, and Fantasy is denied.
        # depguard sees direct imports only; internal/harness/tool's
        # deps_test.go checks the whole dependency closure.
        harness-tool:
          list-mode: lax
          files:
            - "**/internal/harness/tool/**"
            - "**/internal/harness/redact/**"
          allow:
            - github.com/charliek/craze/internal/harness/tool
            - github.com/charliek/craze/internal/harness/redact
            - github.com/charliek/craze/internal/atomicfile
          deny:
            - pkg: github.com/charliek/craze/internal
              desc: "the tool framework imports nothing from craze except internal/atomicfile and internal/harness/redact; toolbridge.go in the harness adapts it to Fantasy (plan 019 §3.1)"
            - pkg: charm.land/fantasy
              desc: "tools are craze's own contract: only internal/harness/toolbridge.go knows both a Tool and Fantasy (plan 019 §3.1, Seam 1)"
        # The redactor is a leaf under everything: the standard library only.
        harness-redact:
          list-mode: strict
          files:
            - "**/internal/harness/redact/**"
          allow:
            - $gostd
        # The control-socket wire (plan 027 §3.2–§3.4, §3.11): a leaf under
        # everything that speaks it, the standard library only, so the server,
        # the client, the fake host and the codecs' own schema tests can all
        # import it and it can import none of them. Its non-test files only:
        # depguard ORs positive file patterns, and "!$test" is the negative
        # that leaves the package's tests free to import the JSON Schema
        # validator (github.com/kaptinlin/jsonschema), as engine's rule does.
        protocol:
          list-mode: strict
          files:
            - "**/internal/protocol/**"
            - "!$test"
          allow:
            - $gostd
        # The engine's own import boundary (plan 021 §3.1): it sits above the
        # provider seam (agent.Session) and knows nothing of any one client or
        # provider transport, so a non-test file here may import neither
        # client package nor the ACP or harness transports. Split in two
        # because the package's own tests need a narrower rule: engine_test
        # drives the engine over tui.Stub, which is an ordinary Go dependency
        # an external test package is allowed to take on the package under
        # test, so $test files answer to a rule that allows internal/tui but
        # still denies internal/cli, internal/acp and internal/harness.
        engine:
          list-mode: lax
          files:
            - "**/internal/engine/**"
            - "!$test"
          deny:
            - pkg: github.com/charliek/craze/internal/tui
              desc: "the engine drives every client uniformly; a client package is exactly what it must not know about (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the engine drives every client uniformly; a client package is exactly what it must not know about (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the engine speaks to agent.Session alone; the wire protocol below that seam is not its concern (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the engine speaks to agent.Session alone; a provider transport below that seam is not its concern (plan 021 §3.1)"
        # The transcript model's import boundary (plan 024 §3.1): the fold every
        # client runs over the event stream, and the engine runs inside the
        # event log's publishing boundary, so it is render-free and knows no
        # client, no transport and no terminal. It imports internal/agent and
        # the standard library; internal/agent never imports it. One glob
        # covers its tests as well as its sources, because they are held to
        # the same boundary and depguard ORs file patterns (a bare $test token
        # beside it would reach every test file in the module — see
        # engine-test below).
        transcript:
          list-mode: lax
          files:
            - "**/internal/transcript/**"
          deny:
            - pkg: github.com/charliek/craze/internal/tui
              desc: "the transcript model is every client's, so no client package is its concern; the TUI imports it, never the reverse (plan 024 §3.1)"
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the transcript model is every client's, so no client package is its concern (plan 024 §3.1)"
            - pkg: github.com/charliek/craze/internal/engine
              desc: "the engine folds the model; the model knows nothing of the engine that holds one of its instances (plan 024 §3.1)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the model folds agent.Events; the wire protocol below that seam is not its concern (plan 024 §3.1)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the model folds agent.Events; a provider transport below that seam is not its concern (plan 024 §3.1)"
            - pkg: github.com/charmbracelet
              desc: "the model is render-free: how anything draws is a client's, and a terminal library has no place in a fold that runs inside the log's boundary (plan 024 §3.1)"
            - pkg: charm.land
              desc: "the model is render-free and provider-free (plan 024 §3.1)"
        engine-test:
          list-mode: lax
          files:
            # depguard ORs several positive patterns rather than ANDing them,
            # so "**/internal/engine/**" plus the bare $test token (which
            # alone means "every test file in the module") would match every
            # test file project-wide, not just this package's. One glob that
            # is already both — under internal/engine and named _test.go — is
            # the combination that stays inside the package.
            - "**/internal/engine/**_test.go"
          deny:
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the engine's own tests drive it over tui.Stub, never a CLI client (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the engine speaks to agent.Session alone; the wire protocol below that seam is not its concern, in a test either (plan 021 §3.1)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the engine speaks to agent.Session alone; a provider transport below that seam is not its concern, in a test either (plan 021 §3.1)"
        # The control socket's server (plan 027 §3.7): it serves the engine
        # over internal/protocol and knows no client package and no provider
        # transport, exactly as the engine it wraps does. Split in two for the
        # same reason engine's rule is: its tests run a real engine over
        # tui.Stub, so $test files answer to control-test, which allows
        # internal/tui and still denies the rest. (internal/control/wiretest,
        # a helper only tests import, answers to this rule too.)
        control:
          list-mode: lax
          files:
            - "**/internal/control/**"
            - "!$test"
          deny:
            - pkg: github.com/charliek/craze/internal/tui
              desc: "the control server serves every client uniformly; a client package is exactly what it must not know about (plan 027 §3.7)"
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the control server serves every client uniformly; a client package is exactly what it must not know about (plan 027 §3.7)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the control server speaks to engine.Control alone; the ACP wire below the session seam is not its concern (plan 027 §3.7)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the control server speaks to engine.Control alone; a provider transport below the session seam is not its concern (plan 027 §3.7)"
        control-test:
          list-mode: lax
          files:
            # One glob that is already both — under internal/control and named
            # _test.go — because depguard ORs positive patterns (engine-test
            # above says why a bare $test would reach every test file).
            - "**/internal/control/**_test.go"
          deny:
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the control server's tests drive it over tui.Stub and a raw socket client, never a CLI client (plan 027 §3.7)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the control server speaks to engine.Control alone; the ACP wire is not its concern, in a test either (plan 027 §3.7)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the control server speaks to engine.Control alone; a provider transport is not its concern, in a test either (plan 027 §3.7)"
        # The control socket's Go client (plan 027 §3.14): it speaks
        # internal/protocol to a host over a socket and needs nothing else of
        # craze — above all not the server it talks to (internal/control), and
        # no client package (tui, cli: PR 4's remote.Session is what a client
        # builds on it) or provider transport. Split in two as control's rule
        # is: its tests run the real server in front of an engine over
        # tui.Stub, so $test files answer to remote-test, which allows
        # internal/control and internal/tui and still denies the rest.
        remote:
          list-mode: lax
          files:
            - "**/internal/remote/**"
            - "!$test"
          deny:
            - pkg: github.com/charliek/craze/internal/control
              desc: "the client must not import the server it talks to: it speaks internal/protocol over a socket (plan 027 §3.14)"
            - pkg: github.com/charliek/craze/internal/tui
              desc: "the protocol client serves every client uniformly; a client package builds on it, never the reverse (plan 027 §3.14)"
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the protocol client serves every client uniformly; a client package builds on it, never the reverse (plan 027 §3.14)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the protocol client speaks the control socket's wire alone; the ACP wire is not its concern (plan 027 §3.14)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the protocol client speaks the control socket's wire alone; a provider transport is not its concern (plan 027 §3.14)"
        remote-test:
          list-mode: lax
          files:
            # One glob that is already both — under internal/remote and named
            # _test.go — because depguard ORs positive patterns (engine-test
            # above says why a bare $test would reach every test file).
            - "**/internal/remote/**_test.go"
          deny:
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the protocol client's tests drive a real server over tui.Stub, never a CLI client (plan 027 §3.14)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the protocol client speaks the control socket's wire alone; the ACP wire is not its concern, in a test either (plan 027 §3.14)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the protocol client speaks the control socket's wire alone; a provider transport is not its concern, in a test either (plan 027 §3.14)"
        # The fake host (plan 027 §3.11): the in-process twin of
        # cmd/craze-fake-host, wrapping the real control server (internal/control)
        # around an engine over tui.Stub, for the executable wire fixtures. It
        # is allowed the two packages it wraps and denied the client and
        # transport packages the fixtures must stay agnostic of.
        fakehost:
          list-mode: lax
          files:
            - "**/internal/fakehost/**"
          deny:
            - pkg: github.com/charliek/craze/internal/cli
              desc: "the fake host is a test double for the wire fixtures, not a CLI client (plan 027 §3.11)"
            - pkg: github.com/charliek/craze/internal/acp
              desc: "the fake host speaks the control socket's wire over a Stub; the ACP wire below the session seam is not its concern (plan 027 §3.11)"
            - pkg: github.com/charliek/craze/internal/harness
              desc: "the fake host speaks the control socket's wire over a Stub; a provider transport below the session seam is not its concern (plan 027 §3.11)"
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
